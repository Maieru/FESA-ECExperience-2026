name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build, test and analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
          
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
          
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
          
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
          
      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" begin `
            /k:"Maieru_FESA-ECExperience-2026" `
            /o:"maieru" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"

      - name: Build
        run: dotnet build --configuration Release --no-restore --no-incremental

      - name: Run unit tests and collect coverage
        run: |
          dotnet test tests/Escola.Tests `
            --configuration Release `
            --no-build `
            --no-restore `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --logger trx `
            --results-directory TestResults/Unit

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Chromium
        run: |
          pwsh tests/Escola.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          dotnet test tests/Escola.E2E `
            --configuration Release `
            --no-build `
            --no-restore `
            --logger trx `
            --logger html `
            --results-directory TestResults/E2E `
            --environment "E2E_HEADEDLESS=1" `

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end `
            /d:sonar.token="$env:SONAR_TOKEN"