<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alunos | FESA EC Experience 2026</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <div class="introducao"><h1>Gestão de alunos</h1></div>
    <p id="mensagem" role="status" aria-live="polite"></p>
    <div class="colunas">
      <section class="painel formulario" aria-labelledby="titulo-formulario">
        <p class="sobretitulo">CADASTRO</p><h2 id="titulo-formulario">Novo aluno</h2><p class="ajuda">Todos os campos são obrigatórios.</p>
        <form id="formulario">
          <label for="ra">RA</label><input id="ra" name="ra" inputmode="numeric" pattern="[0-9]+" required placeholder="Ex.: 001234" aria-describedby="ajuda-ra"><small id="ajuda-ra">Somente números. Zeros à esquerda são preservados.</small>
          <label for="nome">Nome completo</label><input id="nome" name="nome" maxlength="100" required placeholder="Nome e sobrenome" autocomplete="name">
          <label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" name="dataNascimento" type="date" min="1951-01-01" required>
          <label for="dataEntrada">Entrada na escola</label><input id="dataEntrada" name="dataEntrada" type="date" required>
          <label for="curso">Curso</label><select id="curso" name="curso" required><option value="">Selecione um curso</option><option value="EngenhariaDaComputacao">Engenharia da Computação</option><option value="Administracao">Administração</option><option value="EngenhariaDeAlimentos">Engenharia de Alimentos</option></select>
          <div class="botoes"><button type="submit" id="salvar">Cadastrar aluno</button><button type="button" id="cancelar" class="secundario" hidden>Cancelar</button></div>
        </form>
      </section>
      <section class="painel listagem" aria-labelledby="titulo-lista">
        <div class="cabecalho-lista"><div><p class="sobretitulo">COMUNIDADE ACADÊMICA</p><h2 id="titulo-lista">Alunos cadastrados</h2></div><span id="contador" class="contador">0</span></div>
        <p id="vazio" class="vazio">Carregando alunos…</p>
        <div class="tabela-container"><table id="tabela" hidden><thead><tr><th scope="col">Aluno / RA</th><th scope="col">Curso</th><th scope="col">Nascimento</th><th scope="col">Entrada</th><th scope="col">Ações</th></tr></thead><tbody id="alunos"></tbody></table></div>
      </section>
    </div>
    <footer>FESA · EC Experience 2026</footer>
  </main>
</body>
</html>
